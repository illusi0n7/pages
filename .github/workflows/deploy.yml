name: Deploy GitHub Pages (page)

on:
  push:
    branches: [page]
  repository_dispatch:
    types: [build_pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: page
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Build
        run: |
          curl -sSL -o src/lib/main.js https://raw.githubusercontent.com/${{ github.repository }}/main/lib/combinations.js
          curl -sSL -o src/lib/dev.js https://raw.githubusercontent.com/${{ github.repository }}/dev/lib/combinations.js
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


